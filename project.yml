name: Chatter
options:
  bundleIdPrefix: team.budo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.11.0"

settings:
  base:
    MARKETING_VERSION: "1.7"
    # Build number scheme: <yyyymmdd>.<counter that day>
    CURRENT_PROJECT_VERSION: "20260718.1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: X9FHM3F6WK
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Chatter:
    build:
      targets:
        Chatter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChatterTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Chatter:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Chatter
    info:
      path: Chatter/Info.plist
      properties:
        # User-configured MCP servers are often self-hosted over plain HTTP
        # (LAN / Tailscale), so allow non-TLS connections.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iOS prompts for this when connecting to servers on the local network.
        NSLocalNetworkUsageDescription: Chatter connects to MCP servers on your local network.
        # Only HTTPS/ATS-exempt networking, no custom crypto — skips the
        # export-compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # CloudKit pings devices via silent push when records change.
        UIBackgroundModes: [remote-notification]
    dependencies:
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.budo.chatter
        PRODUCT_NAME: Chatter
        # Per-platform entitlements: the APNs entitlement key differs between
        # iOS (aps-environment) and macOS (com.apple.developer.aps-environment),
        # and only macOS carries the app-sandbox key.
        CODE_SIGN_ENTITLEMENTS: Chatter/Chatter-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Chatter/Chatter-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Chatter/Chatter-iOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chatter
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad multitasking requires all four orientations, otherwise
        # App Store Connect rejects the build at upload validation.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        Release:
          # TestFlight/App Store requires the sandbox on macOS. Debug stays
          # unsandboxed so stdio MCP servers keep working during development.
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Chatter/Chatter-macOS-Release.entitlements

  ChatterTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: ChatterTests
    dependencies:
      - target: Chatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.budo.chatter.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen emits the iOS bundle layout for TEST_HOST; on macOS the
        # executable lives in Contents/MacOS, so tests fail to find the host.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Chatter.app/Contents/MacOS/Chatter"
