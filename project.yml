name: Chatter
options:
  bundleIdPrefix: team.budo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.11.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Chatter:
    build:
      targets:
        Chatter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChatterTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Chatter:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Chatter
    info:
      path: Chatter/Info.plist
      properties:
        # User-configured MCP servers are often self-hosted over plain HTTP
        # (LAN / Tailscale), so allow non-TLS connections.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iOS prompts for this when connecting to servers on the local network.
        NSLocalNetworkUsageDescription: Chatter connects to MCP servers on your local network.
    dependencies:
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.budo.chatter
        PRODUCT_NAME: Chatter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chatter
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations__iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        debug:
          CODE_SIGN_IDENTITY: "-"
        release:
          CODE_SIGN_IDENTITY: "-"
    entitlements:
      path: Chatter/Chatter.entitlements
      properties:
        # Sandbox off on macOS so stdio MCP servers can be launched as
        # subprocesses. (Ignored on iOS, which is always sandboxed.)
        com.apple.security.app-sandbox: false

  ChatterTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: ChatterTests
    dependencies:
      - target: Chatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.budo.chatter.tests
        GENERATE_INFOPLIST_FILE: YES
