name: Chatter
options:
  bundleIdPrefix: team.budo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.11.0"

settings:
  base:
    MARKETING_VERSION: "2.10"
    # Build number scheme: <yyyymmdd>.<counter that day>
    CURRENT_PROJECT_VERSION: "20260908.1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: X9FHM3F6WK
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Chatter:
    build:
      targets:
        Chatter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChatterTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ChatterWatch:
    build:
      targets:
        ChatterWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Chatter:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Chatter
    info:
      path: Chatter/Info.plist
      properties:
        # User-configured MCP servers are often self-hosted over plain HTTP
        # (LAN / Tailscale), so allow non-TLS connections.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iOS prompts for this when connecting to servers on the local network.
        NSLocalNetworkUsageDescription: Chatter connects to MCP servers on your local network.
        # Only HTTPS/ATS-exempt networking, no custom crypto — skips the
        # export-compliance question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # "processing" allows iOS 26 continued-processing tasks to keep a
        # running assistant turn alive in the background.
        UIBackgroundModes: [processing]
        # Per-turn continued-processing tasks (iOS 26+), registered lazily
        # with the exact session-UUID suffix before each submission.
        BGTaskSchedulerPermittedIdentifiers: ["team.budo.chatter.turn.*"]
        # The share extension opens chatter://share after dropping PDFs/images
        # into the app-group inbox.
        CFBundleURLTypes:
          - CFBundleURLName: team.budo.chatter
            CFBundleURLSchemes: [chatter]
    dependencies:
      - package: MCP
        product: MCP
      # Embeds the iOS share extension (PDFs/images → new chat draft). The
      # destination filter keeps macOS builds/tests from building it.
      - target: ChatterShareExtension
        destinationFilters: [iOS]
      # Embeds the watchOS app into the iOS app (Watch companion). The
      # destination filter keeps macOS builds/tests from building (and
      # trying to sign) the watch target.
      - target: ChatterWatch
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.budo.chatter
        PRODUCT_NAME: Chatter
        # Per-platform entitlements: the APNs entitlement key differs between
        # iOS (aps-environment) and macOS (com.apple.developer.aps-environment),
        # and only macOS carries the app-sandbox key.
        CODE_SIGN_ENTITLEMENTS: Chatter/Chatter-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Chatter/Chatter-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Chatter/Chatter-iOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chatter
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        # Save-to-Photos for generated images (full-screen viewer).
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save generated images to your photo library."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad multitasking requires all four orientations, otherwise
        # App Store Connect rejects the build at upload validation.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  ChatterWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ChatterWatch
        excludes:
          - "Info.plist"
      # Shared with the iOS/macOS app: models, services, engine, view model.
      - path: Chatter/Models
      - path: Chatter/Persistence.swift
      - path: Chatter/AppEnvironment.swift
      - path: Chatter/ViewModels/ChatViewModel.swift
      - path: Chatter/Services
        excludes:
          # PDFKit does not exist on watchOS; PDF import stays iOS/macOS-only.
          - "Knowledge/PDFKnowledgeImporter.swift"
          - "Knowledge/PDFImportJob.swift"
          - "PDFAttachmentProcessor.swift"
      - path: Chatter/DesignSystem/Theme.swift
      - path: Chatter/Assets.xcassets
      - path: Chatter/AppIcon.icon
    info:
      path: ChatterWatch/Info.plist
      properties:
        # Single-target watchOS app (no WatchKit extension).
        WKApplication: true
        WKCompanionAppBundleIdentifier: team.budo.chatter
        CFBundleDisplayName: Chatter
        # Same ATS exception as the main app: self-hosted MCP over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.budo.chatter.watch
        PRODUCT_NAME: Chatter
        CODE_SIGN_ENTITLEMENTS: ChatterWatch/Chatter-watchOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chatter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  ChatterShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChatterShareExtension
    info:
      path: ChatterShareExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # PDFs and images only — everything else keeps the sheet Chatter-free.
            NSExtensionActivationRule: "SUBQUERY (extensionItems, $item, SUBQUERY ($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"com.adobe.pdf\" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO \"public.image\").@count >= 1).@count >= 1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.budo.chatter.shareextension
        # Module name must differ from the app (swiftmodule collision); the
        # share-sheet label comes from CFBundleDisplayName, not PRODUCT_NAME.
        PRODUCT_NAME: ChatterShareExtension
        CODE_SIGN_ENTITLEMENTS: ChatterShareExtension/ChatterShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chatter
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  ChatterTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: ChatterTests
    dependencies:
      - target: Chatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: team.budo.chatter.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen emits the iOS bundle layout for TEST_HOST; on macOS the
        # executable lives in Contents/MacOS, so tests fail to find the host.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Chatter.app/Contents/MacOS/Chatter"
